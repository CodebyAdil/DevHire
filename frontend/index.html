<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#f7f7fb"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1a1a24"
      media="(prefers-color-scheme: dark)"
    />
    <!--
      Apply the persisted/OS theme before first paint to prevent a flash of the
      wrong theme. Kept in sync afterward by the useTheme hook.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('devhire-theme');
          var isDark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="DevHire — AI-assisted recruiting. Post jobs, screen resumes, and surface ranked candidate shortlists."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>DevHire — AI-assisted recruiting</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
